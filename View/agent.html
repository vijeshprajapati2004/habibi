<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habibi ways Leads</title>
    <style>
        /* Resetting default margin and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        header {
            background: linear-gradient(to right, #014538, #282e48);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 1.5rem;
            color: #fff;
        }

        .main-nav {
            font-size: 0.9rem;
            color: #fff;
        }

        .main-content {
            display: flex;
            justify-content: space-between;
            padding: 50px;
        }

        .lead-info {
            width: 45%;
            background: linear-gradient(to bottom right, #69e4c692, #ffffff);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .registration-form {
            width: 45%;
            background: linear-gradient(to bottom right,#69e4c692, #ffffff );
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        form input[type="text"],
        form input[type="email"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #ccc;
            transition: border-color 0.3s ease;
        }

        form input[type="text"]:focus,
        form input[type="email"]:focus {
            border-color: #d9534f;
        }

        form input[type="submit"] {
            background: linear-gradient(to right,  #050309, #282e48);
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        form input[type="submit"]:hover {
            background: linear-gradient(to right, #050309, #282e48);
        }

        h1 {
            color: #000000;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Habibi ways</div>
        <nav class="main-nav">
            <!-- Navigation items here -->
            Why Habibi ways | Lead Pricing | How it works | FAQs
            Call Us +91-8522096780 
        </nav>
    </header>
    <div class="main-content">
        <div class="lead-info">
            <!-- Information about buying travel leads -->
            <h1>Book Travel Companion</h1>
            <p>Enjoy your trip with memories . 100% phone & email verified leads.</p>
            <p>Call us at +91-8522096870 and learn about how we can help you.</p>
        </div>
        <div class="registration-form">
            <!-- Registration Form for Travel Agents -->
            <h1>Travel Agent Registration</h1>
            <form action="#">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" placeholder="Enter your Name"><br><br>
                <label for="phone">Phone:</label><br>
                <input type="text" id="phone" name="phone" placeholder="Enter your Phone"><br><br>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" placeholder="Enter your Email"><br><br>
                <input type="submit" value="Submit">
            </form>
        </div>
    </div>
</body>
</html>
